<body>
<div class="item_mail_text_wrapper">
    <div class="item_mail_text">
        Hallo.

        Der folgende Artikel ist nun wieder für Sie verfügbar:<br><br>
    </div>
</div>
<div class="item_mail_view_wrapper"
     style="width: 745px;height: 175px;background-color: #f3f3f3;box-sizing: border-box;padding: 5px;">
    <div class="item_mail_view_wrapper_inner" style="background-color: #e6e6e6;height: 100%;">
        <div class="item_mail_view_left" style="
    float: left;
    width: 100px;
    height: 100%;
">
            <div class="item_mail_view_image_wrapper" style="
    height: 100%;
    display: table;
    width: 100%;
"><a href="%item_link%" style="
    height: 100%;
    display: table-cell;
    vertical-align: middle;
"><img alt="%image_desc%" src="%image_src%"></a></div>
        </div>

        <div class="item_mail_view_right" style="
    float: left;
    width: 635px;
    height: 100%;
">
            <div class="item_mail_view_right_section_top" style="
    height: 50%;
">
                <div class="item_name" style="
    float: left;
    height: 100%;
    width: 50%;
"><a href="%item_link%" style="
    display: block;
    height: 100%;
    box-sizing: border-box;
    padding-top: 25px;
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
    color: #5d5b5b;
">%item_name%</a></div>

                <div class="item_price_wrapper" style="
    float: left;
    height: 100%;
    width: 50%;
    box-sizing: border-box;
">
                    <div class="cross_price" style="
    float: left;
    height: 100%;
    min-width: 0;
"><a href="%item_link%" style="
    display: block;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding-top: 26px;
    font-size: 18px;
    text-decoration: line-through;
    color: red;
">%cross_price%</a></div>

                    <div class="customer_price" style="
    float: left;
    height: 100%;
"><a href="%item_link%" style="
    display: block;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding-top: 24px;
    font-size: 22px;
    text-decoration: none;
    color: green;
    padding-left: 20px;
">%customer_price%</a></div>
                </div>
            </div>

            <div class="item_mail_view_right_section_bottom" style="
    height: 50%;
">
                <div class="item_description" style="
    height: 100%;
"><a href="%item_link%" style="
    display: block;
    text-decoration: none;
    color: black;
    height: 100%;
    padding: 5px;
    box-sizing: border-box;
">%item_description%</a></div>
            </div>
        </div>
    </div>
</div>
</body>
