<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # DB-Zugangsdaten aus der Container-Umgebung an PHP durchreichen
    PassEnv MAIN_MYSQL_DB_HOST
    PassEnv MAIN_MYSQL_DB_PORT
    PassEnv MAIN_MYSQL_DB_USER
    PassEnv MAIN_MYSQL_DB_PASS
    PassEnv MAIN_MYSQL_DB_SCHEMA

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
