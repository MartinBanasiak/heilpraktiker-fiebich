; dev-Einstellungen fuer den lokalen Container
short_open_tag = On
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
log_errors = On
error_log = /dev/stderr

memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 128M
post_max_size = 128M

date.timezone = Europe/Berlin

sendmail_path = "/usr/bin/env cat > /dev/null"

; Legacy-Code gibt Notices vor session_start() aus (PHP 7.4 ist strenger als 7.1).
; Buffering verhindert, dass dadurch die Header zu frueh rausgehen.
output_buffering = 4096

auto_prepend_file = /usr/local/etc/php/dev-prepend.php
