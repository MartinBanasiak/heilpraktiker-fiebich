<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            line-height: 1.4;
            margin: 0;
        }
        html {
            color: #555555;
            display: table;
            height: 100%;
            text-align: center;
            width: 100%;
        }
        body {
            display: table-cell;
            vertical-align: middle;
            margin: 2em auto;
            font-size: 16px;
            font-family: "Arial",sans-serif;
            background-color: #eeeeee;
        }
        h1,
        h2 {
            font-size: 3em;
            font-weight: 400;
            margin:0;
        }
        h1 {
            font-size: 19em;
            line-height:1;
            font-weight: 700;
            margin-bottom: 20px;
        }
        h1:after {
            content: " ";
            display: block;
            width: 100%;
            height: 12px;
            background-color: #555555;
            margin-top: -48px;
        }
        .content {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            background-color: #ffffff;
            padding: 50px 0 80px 0;
        }

        @media (max-width: 767px) {
            h1 {
                font-size: 6em;
            }
            h1:after {
                height: 5px;
                margin-top: -16px;
            }
            h2 {
                font-size: 1em;
            }
            .content {
                padding: 15px 0 20px 0;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <h2>Oops! Page Not Found</h2>
    </div>
</body>
</html>
